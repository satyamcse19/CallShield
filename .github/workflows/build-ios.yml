name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (generates ios/ folder)
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_PUBLIC_GIST_ID: ${{ secrets.GIST_ID }}
          EXPO_PUBLIC_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Setup node for Xcode
        run: |
          NODE_PATH=$(which node)
          echo "Node: $NODE_PATH"
          node --version
          sudo ln -sf "$NODE_PATH" /usr/local/bin/node
          sudo ln -sf "$(which npm)" /usr/local/bin/npm

      - name: Pre-bundle JS with Expo
        run: |
          npx expo export --platform ios --output-dir /tmp/expo-dist 2>&1 | tail -10
          BUNDLE=$(find /tmp/expo-dist -name "*.hbc" -o -name "*.js" | grep ios | head -1)
          echo "Bundle: $BUNDLE"
          cp "$BUNDLE" /tmp/main.jsbundle
          du -sh /tmp/main.jsbundle

      - name: Build iOS app
        env:
          EXPO_PUBLIC_GIST_ID: ${{ secrets.GIST_ID }}
          EXPO_PUBLIC_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -o pipefail
          export NODE_BINARY=/usr/local/bin/node
          xcodebuild \
            -workspace ios/CallShield.xcworkspace \
            -scheme CallShield \
            -configuration Release \
            -archivePath /tmp/CallShield.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            NODE_BINARY=/usr/local/bin/node \
            SKIP_BUNDLING=1 \
            archive 2>&1 | tee /tmp/build.log | tail -20
          ls /tmp/CallShield.xcarchive/Products/Applications/

      - name: Show Swift errors on failure
        if: failure()
        run: |
          echo "=== Swift / Compilation Errors ==="
          grep -E "error:|fatal error:" /tmp/build.log | grep -v "^note:" | head -60 || echo "No error lines found"
          echo "=== Last 50 lines of build log ==="
          tail -50 /tmp/build.log

      - name: Verify extension built
        run: |
          APP_PATH="/tmp/CallShield.xcarchive/Products/Applications/CallShield.app"
          echo "=== All .appex files in archive ==="
          find /tmp/CallShield.xcarchive -name "*.appex" 2>/dev/null || echo "NO APPEX FOUND"
          echo "=== PlugIns contents ==="
          ls -la "$APP_PATH/PlugIns/" 2>/dev/null || echo "NO PLUGINS DIR"
          echo "=== Extension build log ==="
          grep -i "CallShieldExtension" /tmp/build.log | tail -10 || echo "Nothing in log"
          echo "=== CopyFiles phase in pbxproj ==="
          grep -A 5 "Embed Foundation" ios/CallShield.xcodeproj/project.pbxproj | head -20 || echo "Not found"

      - name: Inject bundle into app
        run: |
          APP_PATH="/tmp/CallShield.xcarchive/Products/Applications/CallShield.app"
          echo "Copying bundle into app..."
          cp /tmp/main.jsbundle "$APP_PATH/main.jsbundle"
          cp -r /tmp/expo-dist/assets "$APP_PATH/assets" 2>/dev/null || true
          echo "App contents:"
          ls "$APP_PATH" | grep -E "(jsbundle|assets|PlugIns)"

      - name: Package as IPA
        run: |
          APP_PATH="/tmp/CallShield.xcarchive/Products/Applications/CallShield.app"
          ls "$APP_PATH/Info.plist"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/CallShield.app
          zip -r CallShield-unsigned.ipa Payload/
          du -sh CallShield-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallShield-unsigned-ipa
          path: CallShield-unsigned.ipa
          retention-days: 30
