name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (generates ios/ folder)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Setup node for Xcode
        run: |
          NODE_PATH=$(which node)
          echo "Node: $NODE_PATH"
          node --version
          sudo ln -sf "$NODE_PATH" /usr/local/bin/node
          sudo ln -sf "$(which npm)" /usr/local/bin/npm

      - name: Pre-bundle JS with Expo
        run: |
          echo "--- Expo export ---"
          npx expo export --platform ios --output-dir /tmp/expo-dist 2>&1 | tail -20
          echo "--- Finding bundle ---"
          find /tmp/expo-dist -type f | head -10
          BUNDLE=$(find /tmp/expo-dist -name "*.hbc" -o -name "*.js" | grep ios | head -1)
          echo "Bundle found: $BUNDLE"
          cp "$BUNDLE" /tmp/main.jsbundle
          echo "Bundle size: $(du -sh /tmp/main.jsbundle)"

      - name: Build iOS app
        run: |
          set -o pipefail
          export NODE_BINARY=/usr/local/bin/node
          xcodebuild \
            -workspace ios/CallShield.xcworkspace \
            -scheme CallShield \
            -configuration Release \
            -archivePath /tmp/CallShield.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            NODE_BINARY=/usr/local/bin/node \
            SKIP_BUNDLING=1 \
            BUNDLE_FILE=/tmp/main.jsbundle \
            archive 2>&1 | tee /tmp/build.log
          ls /tmp/CallShield.xcarchive/Products/Applications/

      - name: Package as IPA
        run: |
          APP_PATH="/tmp/CallShield.xcarchive/Products/Applications/CallShield.app"
          echo "Verifying app structure..."
          ls "$APP_PATH"
          ls "$APP_PATH/Info.plist"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/CallShield.app
          zip -r CallShield-unsigned.ipa Payload/
          echo "IPA size:"
          du -sh CallShield-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallShield-unsigned-ipa
          path: CallShield-unsigned.ipa
          retention-days: 30
