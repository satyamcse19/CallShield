name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (generates ios/ folder)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS app (unsigned)
        run: |
          xcodebuild \
            -workspace ios/CallShield.xcworkspace \
            -scheme CallShield \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package as IPA
        run: |
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/CallShield.app"
          echo "App path: $APP_PATH"
          ls "$APP_PATH"
          echo "Info.plist check:"
          ls "$APP_PATH/Info.plist"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/CallShield.app
          zip -r CallShield-unsigned.ipa Payload/
          echo "IPA created successfully"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallShield-unsigned-ipa
          path: CallShield-unsigned.ipa
          retention-days: 30
