name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (generates ios/ folder)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Bundle JavaScript
        run: |
          export NODE_BINARY=$(which node)
          mkdir -p ios/main
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios \
            --reset-cache

      - name: Build iOS app (ad-hoc self-signed)
        run: |
          set -o pipefail
          export NODE_BINARY=$(which node)
          xcodebuild \
            -workspace ios/CallShield.xcworkspace \
            -scheme CallShield \
            -configuration Release \
            -archivePath /tmp/CallShield.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            NODE_BINARY=$(which node) \
            SKIP_BUNDLING=1 \
            BUNDLE_FILE=ios/main.jsbundle \
            archive 2>&1 | tee /tmp/build.log | tail -80
          echo "--- Checking archive ---"
          ls /tmp/CallShield.xcarchive/Products/Applications/

      - name: Package as IPA
        run: |
          APP_PATH="/tmp/CallShield.xcarchive/Products/Applications/CallShield.app"
          echo "Verifying app structure..."
          ls "$APP_PATH"
          ls "$APP_PATH/Info.plist"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/CallShield.app
          zip -r CallShield-unsigned.ipa Payload/
          echo "IPA size:"
          du -sh CallShield-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallShield-unsigned-ipa
          path: CallShield-unsigned.ipa
          retention-days: 30
